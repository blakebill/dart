name: Build & Release

# Build the Windows installer and publish it to a GitHub Release.
# Triggers:
#   - pushing a tag like v0.1.0      -> publishes a release (prerelease if the
#                                       tag contains a hyphen, e.g. v0.1.0-pre)
#   - manual run (workflow_dispatch) -> builds and optionally publishes the
#                                       requested tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      singbox_version:
        description: 'sing-box core version to bundle (empty = latest)'
        required: false
        default: ''
      mihomo_version:
        description: 'mihomo core version to bundle (empty = latest)'
        required: false
        default: ''
      tag:
        description: 'Release tag to publish'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false
      publish:
        description: 'Publish a GitHub Release (off = build-only, artifact uploaded)'
        type: boolean
        default: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write # delete and upload build artifacts
    steps:
      - name: Validate canonical release target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" || "$PUBLISH_REQUESTED" == "true" ]]; then
            if [[ "$REPOSITORY" != "blakebill/dart" ]]; then
              echo "::error::Dart releases must be published from blakebill/dart, not $REPOSITORY."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # Check out the launching ref: the pushed tag on a tag push, or the
        # selected branch on a manual run. (We intentionally do NOT pin to the
        # input tag, since for a new release that tag does not exist yet — it is
        # created by the publish step below.)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Delete old build artifacts
        # The installers are large (~100MB) and accumulate against the account's
        # Actions storage quota (which failed run #84). Remove prior runs'
        # 'dart-windows' artifacts before uploading this run's. First-party
        # github-script (no third-party action). Note: GitHub recalculates
        # storage usage only every 6-12h, so this lowers usage over time rather
        # than freeing the current run instantly. Best-effort — never fail the build.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100,
            });
            const stale = arts.filter((a) => a.name === 'dart-windows');
            for (const a of stale) {
              core.info(`Deleting artifact #${a.id} (${(a.size_in_bytes / 1e6).toFixed(0)}MB)`);
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            }
            core.info(`Deleted ${stale.length} old artifact(s).`);

      - name: Run self-tests
        run: npm test

      - name: Sync package version to release tag
        # The installer file name (Dart.Setup.<version>.exe) is derived
        # from package.json "version". Align it with the release tag so the
        # artifact name always matches the tag, including prerelease suffixes.
        # For a manual build-only run with an empty tag, skip the sync and keep
        # the version that is already in package.json.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # On a tag push, github.ref_name is the tag. On a manual run it's the
          # branch, so take the tag only from the input. Values travel through
          # the environment instead of being interpolated into this script.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ -z "$TAG" ]]; then
            if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
              echo "::error::A release tag is required when Publish is enabled."
              exit 1
            fi
            echo "No tag supplied; keeping current package.json version."
            exit 0
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::Release tag must start with v."
            exit 1
          fi
          VERSION="$(node scripts/release-metadata.js --version-from-tag "$TAG")"
          echo "Setting package.json version to $VERSION (from tag $TAG)"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Download bundled cores and GeoData
        env:
          SINGBOX_VERSION: ${{ github.event.inputs.singbox_version }}
          MIHOMO_VERSION: ${{ github.event.inputs.mihomo_version }}
          SINGBOX_OS: windows
          SINGBOX_ARCH: amd64
        run: npm run fetch-core

      - name: Build Windows installer
        env:
          # Optional. electron-builder signs when both repository secrets are set.
          CSC_LINK: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run dist -- --publish never

      - name: Verify optional Authenticode signature
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          if ($env:SIGNING_ENABLED -ne 'true') {
            Write-Host 'No signing certificate configured; publishing an unsigned build.'
            exit 0
          }
          Get-ChildItem release -Filter '*.exe' | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($_.Name): $($signature.Status)"
            }
          }

      - name: Generate SBOM and checksums
        run: npm run release:metadata

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/sbom.cdx.json
          if-no-files-found: error
          # These installers are large (~100MB each). Tag pushes are also
          # published to a GitHub Release, so the Actions artifact is only a
          # convenience for build-only runs — expire it quickly so the builds
          # don't pile up against the Actions storage quota (which failed run #84).
          retention-days: 7

  publish:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dart-windows
          path: release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # On a tag push use that tag; on manual dispatch use the input tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # When the tag does not exist yet (manual dispatch), create it at the
          # commit this run built — not at the default branch's HEAD.
          target_commitish: ${{ github.sha }}
          # Manual dispatch: use the 'prerelease' input. Tag push: prerelease when
          # the tag contains a hyphen (e.g. v0.1.0-pre).
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/sbom.cdx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
